spring:
  application:
    name: eqse

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  redis:
    host: redis
    port: 6379

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  error:
    include-message: always
